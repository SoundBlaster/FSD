included:
  - FSDDemoApp
  - LocalPackages

excluded:
  - DerivedData
  - .build
  - LocalPackages/**/.build
  - LocalPackages/**/.swiftpm

disabled_rules:
  - trailing_comma

line_length:
  warning: 140
  error: 180
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - id
