name: FSD iOS Lint
description: Run FSD iOS architecture lint for Swift and iOS projects.

inputs:
  root:
    description: Source root containing app, pages, widgets, features, entities, and shared.
    required: false
    default: ""
  config:
    description: Optional .fsd-ios.yml config path. When set, root can be omitted or used as an override.
    required: false
    default: ""
  strict:
    description: Treat FSD lint warnings as errors.
    required: false
    default: "true"
  architecture:
    description: Enable Swift symbol dependency checks.
    required: false
    default: "true"
  format:
    description: Lint report format: text, json, xcode, or sarif.
    required: false
    default: "text"
  output:
    description: Optional output file for machine-readable formats such as sarif.
    required: false
    default: ""
  doctor:
    description: Run fsd-ios doctor before linting.
    required: false
    default: "false"
  working-directory:
    description: Directory where root should be resolved.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Show fsd-ios version
      shell: bash
      run: swift "$GITHUB_ACTION_PATH/tools/fsd-ios.swift" version

    - name: Run fsd-ios doctor
      if: ${{ inputs.doctor == 'true' }}
      shell: bash
      run: swift "$GITHUB_ACTION_PATH/tools/fsd-ios.swift" doctor --json

    - name: Run FSD architecture lint
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_ARCHITECTURE: ${{ inputs.architecture }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail

        args=(lint)

        if [ -n "$INPUT_CONFIG" ]; then
          args+=(--config "$INPUT_CONFIG")
        fi

        if [ -n "$INPUT_ROOT" ]; then
          args+=(--root "$INPUT_ROOT")
        elif [ -z "$INPUT_CONFIG" ]; then
          args+=(--root FSDDemoApp)
        fi

        case "$INPUT_STRICT" in
          true)
            args+=(--strict)
            ;;
          false)
            args+=(--no-strict)
            ;;
          *)
            echo "::error::strict must be true or false"
            exit 2
            ;;
        esac

        case "$INPUT_ARCHITECTURE" in
          true)
            args+=(--architecture)
            ;;
          false)
            args+=(--no-architecture)
            ;;
          *)
            echo "::error::architecture must be true or false"
            exit 2
            ;;
        esac

        case "$INPUT_FORMAT" in
          text|json|xcode|sarif)
            args+=(--format "$INPUT_FORMAT")
            ;;
          *)
            echo "::error::format must be text, json, xcode, or sarif"
            exit 2
            ;;
        esac

        if [ -n "$INPUT_OUTPUT" ]; then
          mkdir -p "$(dirname "$INPUT_OUTPUT")"
          swift "$GITHUB_ACTION_PATH/tools/fsd-ios.swift" "${args[@]}" > "$INPUT_OUTPUT"
        else
          swift "$GITHUB_ACTION_PATH/tools/fsd-ios.swift" "${args[@]}"
        fi
