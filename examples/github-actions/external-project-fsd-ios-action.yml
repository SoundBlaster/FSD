name: FSD iOS Architecture

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fsd-ios:
    name: Run FSD iOS action
    runs-on: macos-26

    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Run FSD architecture lint
        uses: SoundBlaster/FSD@main
        with:
          # Pin the action ref to a tag or commit in production projects.
          config: .fsd-ios.yml
          strict: "true"
          architecture: "true"
          format: text
          doctor: "true"
