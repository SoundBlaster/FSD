name: FSD iOS Action SARIF

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  fsd-ios:
    name: Run FSD iOS Action SARIF lint
    runs-on: macos-26

    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Run FSD architecture lint
        id: fsd_lint
        continue-on-error: true
        uses: SoundBlaster/FSD@main
        with:
          # Pin the action ref to a tag or commit in production projects.
          config: .fsd-ios.yml
          strict: "true"
          architecture: "true"
          format: sarif
          output: fsd-ios.sarif
          doctor: "true"

      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fsd-ios.sarif

      - name: Fail when FSD lint failed
        if: steps.fsd_lint.outcome == 'failure'
        run: exit 1
