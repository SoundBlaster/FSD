name: FSD iOS Architecture

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fsd-ios:
    name: Run FSD iOS lint
    runs-on: macos-26

    steps:
      - name: Checkout app
        uses: actions/checkout@v5

      - name: Checkout FSD iOS tooling
        uses: actions/checkout@v5
        with:
          repository: SoundBlaster/FSD
          ref: <pinned-tag-or-commit>
          path: .fsd-ios-tooling

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Show FSD iOS CLI version
        run: swift .fsd-ios-tooling/tools/fsd-ios.swift version

      - name: Check FSD tooling checkout
        run: swift .fsd-ios-tooling/tools/fsd-ios.swift doctor --json

      - name: Run FSD architecture lint
        run: |
          swift .fsd-ios-tooling/tools/fsd-ios.swift lint \
            --config .fsd-ios.yml
