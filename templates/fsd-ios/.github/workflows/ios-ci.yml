name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate FSD iOS app
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Run FSD lint
        run: |
          make lint
          make lint-strict
          make lint-architecture

      - name: Select iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list devices available

          candidates=(
            "iPhone 17 Pro"
            "iPhone 16e"
            "iPhone 16 Pro"
            "iPhone 15 Pro"
            "iPhone 15"
          )

          selected=""
          for candidate in "${candidates[@]}"; do
            if xcrun simctl list devices available | grep -E "^[[:space:]]+${candidate} \\(" > /dev/null; then
              selected="$candidate"
              break
            fi
          done

          if [ -z "$selected" ]; then
            selected="$(
              xcrun simctl list devices available \
                | sed -nE 's/^[[:space:]]+(iPhone[^()]*) \([A-F0-9-]+\) \(.*\)$/\1/p' \
                | head -n 1 \
                | xargs
            )"
          fi

          if [ -z "$selected" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi

          echo "Selected simulator: $selected"
          echo "name=$selected" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          make build SIMULATOR="${{ steps.simulator.outputs.name }}"

      - name: Run unit tests
        run: |
          make test SIMULATOR="${{ steps.simulator.outputs.name }}"
