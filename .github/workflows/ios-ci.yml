name: iOS CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate FSD demo
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'codex/') }}
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version
          xcrun simctl list runtimes available

      - name: Run FSD lint
        run: |
          make lint
          make lint-strict
          make lint-architecture
          make harmonize-fixture
          make template-create-dry-run
          make template-create-fixture
          make template-validate
          make template-validate-negative
          make spm-template-test
          make spm-template-create-fixture
          make cli-smoke
          make cli-doctor
          make config-smoke
          make report-smoke
          make action-smoke

      - name: Select iOS simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail

          xcrun simctl list devices available

          candidates=(
            "iPhone 17 Pro"
            "iPhone 16e"
            "iPhone 16 Pro"
            "iPhone 15 Pro"
            "iPhone 15"
          )

          selected=""
          for candidate in "${candidates[@]}"; do
            if xcrun simctl list devices available | grep -E "^[[:space:]]+${candidate} \\(" > /dev/null; then
              selected="$candidate"
              break
            fi
          done

          if [ -z "$selected" ]; then
            selected="$(
              xcrun simctl list devices available \
                | sed -nE 's/^[[:space:]]+(iPhone[^()]*) \([A-F0-9-]+\) \(.*\)$/\1/p' \
                | head -n 1 \
                | xargs
            )"
          fi

          if [ -z "$selected" ]; then
            echo "No available iPhone simulator found" >&2
            exit 1
          fi

          echo "Selected simulator: $selected"
          echo "name=$selected" >> "$GITHUB_OUTPUT"

      - name: Build app
        run: |
          xcodebuild \
            -project FSDDemoApp.xcodeproj \
            -scheme FSDDemoApp \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }},OS=latest" \
            -derivedDataPath DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild \
            -project FSDDemoApp.xcodeproj \
            -scheme FSDDemoApp \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }},OS=latest" \
            -derivedDataPath DerivedData \
            test \
            -skip-testing:FSDDemoAppUITests \
            CODE_SIGNING_ALLOWED=NO
