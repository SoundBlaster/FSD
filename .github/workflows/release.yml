name: Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release artifact
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build and smoke-test artifact
        run: make release-artifact-smoke

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsd-ios-release-artifacts
          path: |
            DerivedData/Release/fsd-ios-*.tar.gz
            DerivedData/Release/fsd-ios-*.tar.gz.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            DerivedData/Release/fsd-ios-*.tar.gz \
            DerivedData/Release/fsd-ios-*.tar.gz.sha256 \
            --title "FSD iOS $GITHUB_REF_NAME" \
            --generate-notes
